<VirtualHost *:80>
    ServerName casanova-studio.de
    ServerAlias www.casanova-studio.de
    DocumentRoot /var/www/casanova-studio/current
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://casanova-studio.de%{REQUEST_URI} [R=301,L,NE]
    <Directory /var/www/casanova-studio>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>
    ErrorLog ${APACHE_LOG_DIR}/casanova-studio-error.log
    CustomLog ${APACHE_LOG_DIR}/casanova-studio-access.log combined
</VirtualHost>
<VirtualHost *:443>
    ServerName casanova-studio.de
    ServerAlias www.casanova-studio.de
    DocumentRoot /var/www/casanova-studio/current
    <Directory /var/www/casanova-studio>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>
    SSLEngine On
    SSLCertificateFile /etc/letsencrypt/live/casanova-studio.de/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/casanova-studio.de/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf
    ErrorLog ${APACHE_LOG_DIR}/casanova-studio-ssl-error.log
    CustomLog ${APACHE_LOG_DIR}/casanova-studio-ssl-access.log combined
</VirtualHost>
